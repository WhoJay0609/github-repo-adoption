name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate SKILL.md frontmatter and relative Markdown links
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          root = Path(".")
          skill_path = root / "SKILL.md"
          if not skill_path.is_file():
              print("Missing SKILL.md", file=sys.stderr)
              sys.exit(1)

          skill_text = skill_path.read_text(encoding="utf-8")
          m = re.match(r"^---\r?\n(.*?)\r?\n---\r?\n", skill_text, flags=re.S)
          if not m:
              print("SKILL.md is missing YAML frontmatter", file=sys.stderr)
              sys.exit(1)

          frontmatter = {}
          current_key = None
          for line in m.group(1).splitlines():
              if not line.strip() or line.lstrip().startswith("#"):
                  continue
              if line[0].isspace() and current_key:
                  frontmatter[current_key] = (frontmatter[current_key] + " " + line.strip()).strip()
                  continue
              if ":" not in line:
                  print(f"Malformed frontmatter line: {line}", file=sys.stderr)
                  sys.exit(1)
              key, value = line.split(":", 1)
              current_key = key.strip()
              frontmatter[current_key] = value.strip().strip('"').strip("'")

          for required in ("name", "description"):
              if not frontmatter.get(required):
                  print(f"SKILL.md frontmatter missing non-empty '{required}'", file=sys.stderr)
                  sys.exit(1)

          broken = []
          checked = 0
          for md in sorted(root.rglob("*.md")):
              if any(part == ".git" for part in md.parts):
                  continue
              rel = md.relative_to(root)
              in_templates = rel.parts[:2] == ("assets", "templates")
              text = md.read_text(encoding="utf-8")
              text = re.sub(r"```.*?```", "", text, flags=re.S)
              text = re.sub(r"`[^`]*`", "", text)
              for raw_target in re.findall(r"\[[^\]]*\]\(([^)]+)\)", text):
                  target = raw_target.strip().split()[0]
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  if in_templates and "{{" in target and "}}" in target:
                      continue
                  path_part = target.split("#", 1)[0].split("?", 1)[0]
                  if not path_part:
                      continue
                  checked += 1
                  if not (md.parent / path_part).exists():
                      broken.append(f"{rel} -> {target}")

          if broken:
              print("Broken relative Markdown links:", file=sys.stderr)
              for item in broken:
                  print(f"  - {item}", file=sys.stderr)
              sys.exit(1)

          print(f"SKILL.md frontmatter valid (name={frontmatter['name']}); verified {checked} relative Markdown links.")
          PY
